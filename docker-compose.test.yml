name: scryguard-test

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    container_name: scryguard-postgres-test
    restart: 'no'
    init: true
    environment:
      POSTGRES_USER: ${TEST_DB_USER:?TEST_DB_USER is required}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?TEST_DB_PASSWORD is required}
      POSTGRES_DB: ${TEST_DB_NAME:?TEST_DB_NAME is required}
    ports:
      - '127.0.0.1:${TEST_DB_PORT:?TEST_DB_PORT is required}:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    shm_size: 128mb

  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    container_name: scryguard-redis-test
    restart: 'no'
    init: true
    environment:
      REDISCLI_AUTH: ${TEST_REDIS_PASSWORD:?TEST_REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server --appendonly no --save ""
        --maxmemory 128mb --maxmemory-policy noeviction
        --requirepass "$$REDISCLI_AUTH"
    ports:
      - '127.0.0.1:${TEST_REDIS_PORT:?TEST_REDIS_PORT is required}:6379'
    healthcheck:
      test: [CMD-SHELL, "redis-cli -h 127.0.0.1 -p 6379 ping | grep -q '^PONG$$'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
    container_name: scryguard-elasticmq-test
    restart: 'no'
    init: true
    volumes:
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - '127.0.0.1:${TEST_SQS_PORT:?TEST_SQS_PORT is required}:9324'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:9324/?Action=ListQueues']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  rustfs:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    container_name: scryguard-rustfs-test
    restart: 'no'
    init: true
    environment:
      RUSTFS_ACCESS_KEY: ${TEST_S3_ACCESS_KEY_ID:?TEST_S3_ACCESS_KEY_ID is required}
      RUSTFS_SECRET_KEY: ${TEST_S3_SECRET_ACCESS_KEY:?TEST_S3_SECRET_ACCESS_KEY is required}
      RUSTFS_VOLUMES: /data
    ports:
      - '127.0.0.1:${TEST_S3_PORT:?TEST_S3_PORT is required}:9000'
    tmpfs:
      - /data:uid=10001,gid=10001
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # One-shot: creates the bucket once RustFS is healthy, then exits.
  rustfs-init:
    image: amazon/aws-cli:2.39.3@sha256:d557b3524475d70dd3104cf44d96568ee3188897b73a6ece2b37aa50e1af362f
    container_name: scryguard-rustfs-init-test
    restart: 'no'
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${TEST_S3_ACCESS_KEY_ID:?TEST_S3_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${TEST_S3_SECRET_ACCESS_KEY:?TEST_S3_SECRET_ACCESS_KEY is required}
      AWS_DEFAULT_REGION: ${TEST_S3_REGION:?TEST_S3_REGION is required}
    command:
      [
        '--endpoint-url',
        'http://rustfs:9000',
        's3',
        'mb',
        's3://${TEST_S3_BUCKET:?TEST_S3_BUCKET is required}',
      ]

  # The image has no shell, so the healthcheck uses its own CLI.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0@sha256:5d3dae09bc185dcc5ff6cf43abf6062a4a720aff0c4306a471e773acdcd107aa
    container_name: scryguard-toxiproxy-test
    restart: 'no'
    command: ['-host=0.0.0.0', '-port=8475', '-config=/config/toxiproxy.json']
    volumes:
      - ./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - '127.0.0.1:8475:8475'
      - '127.0.0.1:5462:5462'
      - '127.0.0.1:6412:6412'
    # rustfs-init listed here so `up --wait` treats its exit as expected, not a failure.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', '/toxiproxy-cli', '--host', 'http://127.0.0.1:8475', 'list']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # The tools profile keeps it out of `up`; the secret-scan test starts it with `run`.
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    profiles: [tools]
    restart: 'no'
    network_mode: none
