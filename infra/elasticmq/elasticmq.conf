include classpath("application.conf")

# Queue URLs take the host and port from each request, so the test stack's
# mapped port is returned instead of the container's own 9324.
node-address {
  host = "*"
}

queues {
  review-jobs-dlq {}
  review-jobs {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "review-jobs-dlq"
      maxReceiveCount = 5
    }
  }
}
