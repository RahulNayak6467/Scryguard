name: scryguard-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    container_name: scryguard-postgres
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    ports:
      - '127.0.0.1:${DB_PORT:?DB_PORT is required}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    shm_size: 128mb

  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    container_name: scryguard-redis
    restart: unless-stopped
    init: true
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # No persistence: Redis holds only rebuildable data (ADR 0001, ADR 0006).
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server --appendonly no --save ""
        --maxmemory 256mb --maxmemory-policy noeviction
        --requirepass "$$REDISCLI_AUTH"
    ports:
      - '127.0.0.1:${REDIS_PORT:?REDIS_PORT is required}:6379'
    healthcheck:
      test: [CMD-SHELL, "redis-cli -h 127.0.0.1 -p 6379 ping | grep -q '^PONG$$'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  elasticmq:
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    image: softwaremill/elasticmq-native:1.7.1@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
    container_name: scryguard-elasticmq
    restart: unless-stopped
    init: true
    volumes:
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - '127.0.0.1:${SQS_PORT:?SQS_PORT is required}:9324'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:9324/?Action=ListQueues']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    container_name: scryguard-rustfs
    restart: unless-stopped
    init: true
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      RUSTFS_VOLUMES: /data
    ports:
      - '127.0.0.1:${S3_PORT:?S3_PORT is required}:9000'
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  rustfs-init:
    image: amazon/aws-cli:2.40.3@sha256:33a16c53ea442e918b58df67301ad76a8fb57082c39f7e78753b898c3f3e87c2
    container_name: scryguard-rustfs-init
    restart: 'no'
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      AWS_DEFAULT_REGION: ${S3_REGION:?S3_REGION is required}
    command:
      [
        '--endpoint-url',
        'http://rustfs:9000',
        's3',
        'mb',
        's3://${S3_BUCKET:?S3_BUCKET is required}',
      ]

volumes:
  postgres_data:
    name: scryguard-postgres-data
  rustfs_data:
    name: scryguard-rustfs-data
